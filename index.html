<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6Call | Dark System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050000;
    color: #ff0000;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Consolas, monospace;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.65;
}

.skull {
    position: fixed;
    font-size: 12px;
    line-height: 12px;
    white-space: pre;
    color: #ff1010;
    opacity: 0.18;
    text-shadow: 0 0 8px red;
    pointer-events: none;
}

.content {
    position: relative;
    z-index: 2;
    text-align: center;
}

h1 {
    font-size: clamp(65px, 14vw, 130px);
    letter-spacing: 15px;
    color: #ff0000;
    text-shadow:
        0 0 10px red,
        0 0 25px red,
        0 0 60px #a00000;
    animation: pulse 2s infinite alternate;
}

.subtitle {
    margin-top: 20px;
    font-size: 13px;
    letter-spacing: 7px;
    color: #ff5555;
}

.line {
    width: 250px;
    height: 2px;
    margin: 25px auto;
    background: red;
    box-shadow: 0 0 15px red;
}

.status {
    font-size: 12px;
    color: #ff2222;
    letter-spacing: 4px;
}

@keyframes pulse {
    from {
        text-shadow: 0 0 10px red, 0 0 25px red;
    }
    to {
        text-shadow: 0 0 25px red, 0 0 70px red;
    }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<pre class="skull" id="skull"></pre>

<div class="content">
    <h1>6Call</h1>
    <div class="line"></div>
    <div class="subtitle">WELCOME TO THE DARK SIDE</div>
    <br><br>
    <div class="status">[ SYSTEM ONLINE ]</div>
</div>

<script>
const skull = `
             010101010101
          010101010101010101
        0101010101010101010101
       010101010101010101010101
      01010101010101010101010101
      01010101010101010101010101
       010101010101010101010101
         01010101010101010101
           0101010101010101
             010101010101
              0101010101
              0101010101
              0101010101
             010101010101
            01010101010101
`;

document.getElementById("skull").textContent = skull;

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let columns, drops;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / 18);
    drops = Array(columns).fill(1);
}

resize();
window.addEventListener("resize", resize);

function draw() {
    ctx.fillStyle = "rgba(5, 0, 0, 0.12)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ff0000";
    ctx.font = "15px monospace";

    drops.forEach((y, i) => {
        const num = Math.random() > 0.5 ? "1" : "0";
        ctx.fillText(num, i * 18, y * 18);

        if (y * 18 > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    });
}

setInterval(draw, 45);
</script>

</body>
</html>
